name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job builds, runs the unit tests and the stream round-trip, and records
# the SHA-256 of the compressed sample. The last job compares the three: the
# format is supposed to produce the same bytes on every architecture.

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
      - name: Build
        run: ./scripts/build.sh --libsais
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux-x64
          path: hash.txt

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
      - name: Build
        run: ./scripts/build.sh --libsais
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux-arm64
          path: hash.txt

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: brew install fpc
      - name: Build
        run: ./scripts/build.sh --libsais
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-macos-arm64
          path: hash.txt

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          if (-not (Test-Path "$env:TEMP\fpc-setup.exe")) { throw 'download failed' }
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'

      - name: Add the toolchains to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          $roots = @('C:\FPC', 'C:\Program Files\Free Pascal', 'C:\tools\freepascal') |
            Where-Object { Test-Path $_ }
          $all = @($roots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter fpc.exe -ErrorAction SilentlyContinue })
          Write-Host "fpc candidates: $($all.FullName -join '; ')"
          $fpc = $all | Where-Object { $_.FullName -match 'x86_64' } | Select-Object -First 1
          if (-not $fpc) { $fpc = $all | Select-Object -First 1 }
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Write-Host "using $($fpc.FullName)"
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: FPC banner
        shell: bash
        run: |
          fpc -iV
          fpc -iTP -iTO 2>&1 || true
          find /c/FPC -iname 'ppc*.exe' 2>/dev/null | head -20 || true
      - name: Build
        shell: bash
        run: ./scripts/build.sh --libsais --portable --target win-native
      - name: Test
        shell: bash
        run: sh .github/test-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-windows-x64
          path: hash.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc clang
      - name: Fuzz the entropy decoder
        run: sh .github/fuzz.sh 60 2

  determinism:
    needs: [linux-x64, linux-arm64, macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: false
      - name: Compare hashes
        run: |
          for f in hash-*/*; do echo "$f: $(cat "$f")"; done
          n=$(cat hash-*/* | sort -u | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "compressed output differs between platforms" >&2
            exit 1
          fi
          echo "same bytes on every platform"
